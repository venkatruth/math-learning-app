<!DOCTYPE html>
<html>
<head>
<title>Math Learning App</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<!-- ✅ PWA -->
<link rel="manifest" href="/math-learning-app/manifest.json">
<meta name="theme-color" content="#2c3e50">

<!-- ✅ Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  font-family: Arial;
  text-align:center;
  padding:20px;
  background: linear-gradient(135deg, #74ebd5, #9face6);
}

.container {
  background:white;
  padding:20px;
  border-radius:20px;
  max-width:420px;
  margin:auto;
  box-shadow:0 0 20px rgba(0,0,0,0.2);
}

button {
  padding:12px;
  margin:8px;
  width:220px;
  font-size:16px;
  border-radius:10px;
  transition: transform 0.2s, background 0.2s;
}

button:active {
  transform: scale(0.95);
  background:#4CAF50;
}

input {
  padding:10px;
  font-size:16px;
  width:150px;
  text-align:center;
}

#progressBar {
  height:20px;
  width:0%;
  background:green;
  border-radius:10px;
  transition: width 0.4s;
}

@keyframes fall {
  to { transform: translateY(100vh); }
}
</style>
</head>

<body>

<div class="container">

<h2>
<img src="icon.png" width="30" style="vertical-align:middle;">
Math Learning App
</h2>

<!-- ✅ INSTALL BUTTON -->
<button id="installBtn" style="display:none;">📲 Install App</button>

<select id="studentSelect">
<option value="">Select Student</option>
</select><br><br>

<input type="text" id="newStudent" placeholder="Add New Name"><br><br>
<button onclick="startApp(); enableFullscreen();">Start</button>

<div id="menu" style="display:none;">
<button onclick="startQuiz('easy')">Easy</button>
<button onclick="startQuiz('medium')">Medium</button>
<button onclick="startQuiz('hard')">Hard</button>
</div>

<div id="typeMenu" style="display:none;">
<h3>Select Type</h3>
<button onclick="beginQuiz('add')">Addition</button>
<button onclick="beginQuiz('sub')">Subtraction</button>
<button onclick="beginQuiz('mul')">Multiplication</button>
<button onclick="beginQuiz('series')">Number Series</button>
</div>

<div id="quiz" style="display:none;">
<div style="width:100%; background:#ddd;">
<div id="progressBar"></div>
</div><br>

<h3 id="question"></h3>

<input id="answer" oninput="enableBtn()" onkeypress="if(event.key==='Enter') checkAnswer()"><br><br>

<button id="submitBtn" onclick="checkAnswer()" disabled>Submit</button>
<p id="feedback"></p>
</div>

<div id="resultBox" style="display:none;">
<h3 id="result"></h3>
<h2 id="stars"></h2>
</div>

<div id="dashboard" style="display:none;">
<h2>📊 Student Dashboard</h2>
<h3 id="bestScore"></h3>
<table border="1" style="margin:auto;">
<thead><tr><th>Date</th><th>Score</th></tr></thead>
<tbody id="historyTable"></tbody>
</table>
</div>

<div id="leaderboard" style="display:none;">
<h2>🏆 Leaderboard</h2>
<ol id="leaderList"></ol>
</div>

<canvas id="scoreChart" width="350" height="200" style="display:none;"></canvas>

</div>

<script>

// ✅ SERVICE WORKER
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/math-learning-app/service-worker.js")
      .then(reg => console.log("✅ SW registered:", reg.scope))
      .catch(err => console.log("❌ SW error:", err));
  });
}

// ✅ INSTALL APP
let deferredPrompt;

window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById("installBtn").style.display = "block";
});

document.getElementById("installBtn").addEventListener("click", async () => {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    const choice = await deferredPrompt.userChoice;
    deferredPrompt = null;
  } else {
    alert("Tap ⋮ → Install App");
  }
});

// ✅ SOUND
let correctSound = new Audio("https://www.soundjay.com/buttons/sounds/button-09.mp3");
let wrongSound = new Audio("https://www.soundjay.com/buttons/sounds/button-10.mp3");

function rand(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }

// ✅ FULLSCREEN
function enableFullscreen(){
  let elem=document.documentElement;
  if(elem.requestFullscreen) elem.requestFullscreen();
}

// ✅ CONFETTI
function showConfetti(){
 for(let i=0;i<25;i++){
  let d=document.createElement("div");
  d.style.position="fixed";
  d.style.width="6px";
  d.style.height="6px";
  d.style.background="red";
  d.style.top="0px";
  d.style.left=Math.random()*window.innerWidth+"px";
  d.style.animation="fall 1.5s linear";
  document.body.appendChild(d);
  setTimeout(()=>d.remove(),1500);
 }
}

// ✅ STUDENTS
function loadStudents(){
 let list=JSON.parse(localStorage.getItem("students")||"[]");
 let sel=document.getElementById("studentSelect");
 list.forEach(n=>{
  let o=document.createElement("option");
  o.value=n; o.text=n; sel.add(o);
 });
}
window.onload=loadStudents;

// ✅ START
function startApp(){
 let s=document.getElementById("studentSelect").value;
 let n=document.getElementById("newStudent").value.trim();

 if(n){
  currentUser=n;
  let list=JSON.parse(localStorage.getItem("students")||"[]");
  if(!list.includes(n)){ list.push(n); localStorage.setItem("students",JSON.stringify(list)); }
 }
 else if(s){ currentUser=s; }
 else return alert("Enter/select name");

 document.getElementById("menu").style.display="block";
}

let currentUser="", questions=[], index=0, score=0, selectedLevel="";
let correct=["Fantastic!","Superstar!","Brilliant!","Champion!","On fire!"];

function startQuiz(level){
 selectedLevel=level;
 document.getElementById("menu").style.display="none";
 document.getElementById("typeMenu").style.display="block";
}

// ✅ HYBRID QUIZ
async function beginQuiz(type){
 let sheetQ = await fetchQuestions(selectedLevel,type);
 let finalQ = [];

 if(sheetQ.length>0){
  sheetQ.sort(()=>0.5-Math.random());
  finalQ = sheetQ.slice(0,10);
 }

 while(finalQ.length<10){
  let q=generateRandomQuestion(selectedLevel,type);
  if(!finalQ.some(x=>x.q===q.q)){
    finalQ.push(q);
  }
 }

 questions=finalQ;
 index=0; score=0;

 document.getElementById("typeMenu").style.display="none";
 document.getElementById("quiz").style.display="block";

 showQ();
}

async function fetchQuestions(level,type){
 const url="https://script.google.com/macros/s/AKfycbwkGmHle5nKcXW76qLKy7yNLuc-_rYYzlbGH0yDh44KAwH7ok7dyTVktibtibDoTHor/exec";
 let res=await fetch(url);
 let data=await res.json();
 return data.filter(q=>q.level===level && q.type===type)
  .map(q=>({q:q.question,a:q.answer}));
}

function generateRandomQuestion(level,type){
 if(type==="add") return addQ(level);
 if(type==="sub") return subQ(level);
 if(type==="mul") return mulQ(level);
 return seriesQ();
}

// ✅ QUESTION TYPES
function addQ(level){
 let count=rand(2,6), max=level==="easy"?9:level==="medium"?49:100;
 let nums=[],sum=0;
 for(let i=0;i<count;i++){let n=rand(0,max); nums.push(n); sum+=n;}
 return {q:nums.join(" + ")+" = ?",a:sum};
}

function subQ(level){
 let max=level==="easy"?9:level==="medium"?49:100;
 let a=rand(0,max), b=rand(0,a);
 return {q:a+" - "+b+" = ?",a:a-b};
}

function mulQ(level){
 let count=rand(2,3), max=level==="easy"?9:level==="medium"?12:20;
 let nums=[];
 for(let i=0;i<count;i++) nums.push(rand(1,max));
 return {q:nums.join(" × "),a:nums.reduce((x,y)=>x*y)};
}

function seriesQ(){
 let steps=[1,2,3,-1,-2,-3];
 let step=steps[rand(0,5)];
 let start=rand(5,50);

 let arr=[];
 for(let i=0;i<5;i++){
  let v=start+i*step;
  if(v<1) return seriesQ();
  arr.push(v);
 }

 let m=rand(1,3);
 let ans=arr[m];
 arr[m]="__";
 return {q:arr.join(", "),a:ans};
}

// ✅ QUIZ FLOW
function showQ(){
 if(index>=questions.length) return finish();

 document.getElementById("answer").value="";
 document.getElementById("submitBtn").disabled=true;
 document.getElementById("feedback").innerText="";

 document.getElementById("question").innerText=questions[index].q;
 setTimeout(()=>document.getElementById("answer").focus(),100);
}

function enableBtn(){
 let v=document.getElementById("answer").value.trim();
 document.getElementById("submitBtn").disabled=(v===""||isNaN(v));
}

function checkAnswer(){
 let user=document.getElementById("answer").value.trim();
 if(user===""||isNaN(user)) return;

 let correctAnswer=questions[index].a;

 if(user==correctAnswer){
  correctSound.play();
  showConfetti();
  score++;
 } else {
  wrongSound.play();
  document.getElementById("feedback").innerText="Answer: "+correctAnswer;
 }

 index++;
 updateBar();
 setTimeout(showQ,1000);
}

function updateBar(){
 let p=(index/questions.length)*100;
 document.getElementById("progressBar").style.width=p+"%";
}

// ✅ RESULT
function stars(s){
 if(s===10) return "⭐⭐⭐⭐⭐";
 if(s>=8) return "⭐⭐⭐⭐";
 if(s>=6) return "⭐⭐⭐";
 return "⭐⭐";
}

function finish(){
 document.getElementById("quiz").style.display="none";
 document.getElementById("resultBox").style.display="block";

 document.getElementById("result").innerText=currentUser+" scored "+score+"/10";
 document.getElementById("stars").innerText=stars(score);

 saveScoreToSheet(currentUser,score);
 setTimeout(()=>loadDashboard(currentUser),1500);
}

// ✅ SAVE
function saveScoreToSheet(name,score){
 const url="https://script.google.com/macros/s/AKfycbwkGmHle5nKcXW76qLKy7yNLuc-_rYYzlbGH0yDh44KAwH7ok7dyTVktibtibDoTHor/exec";
 fetch(url,{
  method:"POST",
  mode:"no-cors",
  body:JSON.stringify({name,score}),
  headers:{"Content-Type":"application/json"}
 });
}

// ✅ DASHBOARD + LEADERBOARD + GRAPH
function loadDashboard(name){
 const url="https://script.google.com/macros/s/AKfycbwkGmHle5nKcXW76qLKy7yNLuc-_rYYzlbGH0yDh44KAwH7ok7dyTVktibtibDoTHor/exec";

 fetch(url)
 .then(res=>res.json())
 .then(data=>{
   let userData=data.filter(d=>d.name===name);
   if(!userData.length) return;

   let best=Math.max(...userData.map(x=>x.score));
   document.getElementById("bestScore").innerText="🏆 Best Score: "+best+"/10";

   let table=document.getElementById("historyTable");
   table.innerHTML="";
   userData.reverse().forEach(d=>{
     let tr=document.createElement("tr");
     let date=new Date(d.date).toLocaleDateString();
     tr.innerHTML="<td>"+date+"</td><td>"+d.score+"/10</td>";
     table.appendChild(tr);
   });

   document.getElementById("dashboard").style.display="block";
 });
}
</script>

</body>
</html>
