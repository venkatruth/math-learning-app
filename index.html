<!DOCTYPE html>
<html>
<head>
  <title>Math Learning App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ✅ PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2c3e50">

  <style>
    body { font-family: Arial; text-align:center; padding:20px; }

    button {
      padding:12px;
      margin:8px;
      width:220px;
      font-size:16px;
      border-radius:10px;
    }

    input {
      padding:10px;
      font-size:16px;
      width:150px;
      text-align:center;
    }

    #progressBar {
      height:20px;
      width:0%;
      background:green;
      border-radius:10px;
      transition: width 0.4s;
    }

    @keyframes fall {
      to { transform: translateY(100vh); }
    }
  </style>
</head>

<body>

<h2>📘 Math Learning App</h2>

<!-- ✅ STUDENT SELECT -->
<select id="studentSelect">
<option value="">Select Student</option>
</select><br><br>

<input type="text" id="newStudent" placeholder="Add New Name"><br><br>
<button onclick="startApp()">Start</button>

<div id="menu" style="display:none;">
<button onclick="startQuiz('easy')">Easy</button>
<button onclick="startQuiz('medium')">Medium</button>
<button onclick="startQuiz('hard')">Hard</button>
</div>

<div id="quiz" style="display:none;">

<div style="width:100%; background:#ddd;">
<div id="progressBar"></div>
</div><br>

<h3 id="question"></h3>

<input id="answer" oninput="enableBtn()" onkeypress="if(event.key==='Enter') checkAnswer()"><br><br>

<button id="submitBtn" onclick="checkAnswer()" disabled>Submit</button>

<p id="feedback"></p>

</div>

<div id="resultBox" style="display:none;">
<h3 id="result"></h3>
<h2 id="stars"></h2>
<p id="achievement"></p>
</div>

<script>

let currentUser="";
let questions=[];
let index=0, score=0;

let correct=["Fantastic!","Superstar!","Brilliant!","Champion!","On fire!"];
let wrong=["Nice try!","Almost!","Try again","Keep going!"];

function speak(t){ speechSynthesis.speak(new SpeechSynthesisUtterance(t)); }

function rand(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }

// ✅ QUESTIONS
function addQ(level){
 let count=rand(2,6);
 let min=1,max=10;
 if(level==="medium"){min=1;max=50;}
 if(level==="hard"){min=1;max=500;}

 let nums=[],sum=0;
 for(let i=0;i<count;i++){let n=rand(min,max);nums.push(n);sum+=n;}
 return {q:nums.join(" + ")+" = ?",a:sum};
}

function mulQ(level){
 let nums=[],c=rand(3,5);
 for(let i=0;i<c;i++) nums.push(rand(2,9));
 return {q:nums.join(" × "),a:nums.reduce((x,y)=>x*y)};
}

function seriesQ(){
 let s=[1,2,-1,-2][rand(0,3)];
 let start=rand(10,50);
 let arr=[];
 for(let i=0;i<5;i++)arr.push(start+i*s);
 let m=rand(1,3);
 let ans=arr[m];
 arr[m]="__";
 return {q:arr.join(","),a:ans};
}

function generateQuestions(level){
 let arr=[];
 for(let i=0;i<10;i++){
  let t=rand(0,2);
  if(t===0) arr.push(addQ(level));
  else if(t===1) arr.push(mulQ(level));
  else arr.push(seriesQ());
 }
 return arr;
}

// ✅ PROGRESS
function updateBar(){
 let p=(index/questions.length)*100;
 document.getElementById("progressBar").style.width=p+"%";
}

// ✅ STUDENTS
function loadStudents(){
 let list=JSON.parse(localStorage.getItem("students")||"[]");
 let sel=document.getElementById("studentSelect");
 list.forEach(n=>{
  let o=document.createElement("option");
  o.value=n; o.text=n; sel.add(o);
 });
}
window.onload=loadStudents;

// ✅ START
function startApp(){
 let s=document.getElementById("studentSelect").value;
 let n=document.getElementById("newStudent").value.trim();

 if(n){ currentUser=n;
  let list=JSON.parse(localStorage.getItem("students")||"[]");
  if(!list.includes(n)){ list.push(n); localStorage.setItem("students",JSON.stringify(list)); }
 }
 else if(s){ currentUser=s; }
 else return alert("Enter/select name");

 document.getElementById("menu").style.display="block";
}

// ✅ QUIZ
function startQuiz(level){
 questions=generateQuestions(level);
 index=0; score=0;
 document.getElementById("quiz").style.display="block";
 showQ();
}

// ✅ SHOW
function showQ(){
 if(index>=questions.length) return finish();

 document.getElementById("answer").value="";
 document.getElementById("submitBtn").disabled=true;

 document.getElementById("question").innerText=questions[index].q;
 document.getElementById("answer").focus();
}

// ✅ BUTTON
function enableBtn(){
 let v=document.getElementById("answer").value.trim();
 document.getElementById("submitBtn").disabled=(v==="");
}

// ✅ CHECK
function checkAnswer(){
 let user=document.getElementById("answer").value;
 let correctAnswer=questions[index].a;

 if(user==correctAnswer){
  document.getElementById("feedback").innerText=correct[rand(0,4)];
  score++;
 } else {
  document.getElementById("feedback").innerText="Answer: "+correctAnswer;
 }

 index++;
 updateBar();

 setTimeout(showQ,1000);
}

// ✅ STARS
function stars(s){
 if(s===10) return "⭐⭐⭐⭐⭐";
 if(s>=8) return "⭐⭐⭐⭐";
 if(s>=6) return "⭐⭐⭐";
 return "⭐⭐";
}

// ✅ FINISH
function finish(){
 document.getElementById("quiz").style.display="none";
 document.getElementById("resultBox").style.display="block";

 document.getElementById("result").innerText=currentUser+" scored "+score+"/10";
 document.getElementById("stars").innerText=stars(score);
}

</script>

</body>
</html>
