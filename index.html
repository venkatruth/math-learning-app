<!DOCTYPE html>
<html>
<head>
<title>Math Learning App</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial;
  text-align:center;
}

input {
  padding:10px;
  font-size:16px;
  margin:5px;
}
</style>
</head>

<body>

<h2>Math Learning App</h2>

<div id="quiz">

  <h3 id="question"></h3>

  <div id="answerContainer"></div>

  <!-- ✅ FIX: added id -->
  <button id="submitBtn" onclick="checkAnswer()">Submit</button>

  <p id="feedback"></p>

</div>

<script>

let questions = [
  { q: "5, __, __, 8, 9", a: [6,7] },   // ✅ series
  { q: "3 + 5 = ?", a: 8 }              // ✅ normal
];

let index = 0;
let score = 0;

// ✅ SHOW QUESTION
function showQ(){

  // ✅ FIX: prevent crash
  if(index >= questions.length){
    document.getElementById("question").innerText = "Quiz finished!";
    return;
  }

  document.getElementById("feedback").innerText = "";

  let q = questions[index].q;

  let questionElem = document.getElementById("question");
  let container = document.getElementById("answerContainer");

  container.innerHTML = "";

  // ✅ SERIES
  if (q.includes("__")) {

    questionElem.innerText = "";

    renderSeriesInputs(q);

  } else {

    // ✅ NORMAL
    questionElem.innerText = q;

    container.innerHTML =
      '<input id="answer" onkeypress="if(event.key===\'Enter\') checkAnswer()">';

    setTimeout(()=>{
      let inp = document.getElementById("answer");
      if(inp) inp.focus();
    },100);
  }
}


// ✅ RENDER SERIES INPUTS
function renderSeriesInputs(question){

  const container = document.getElementById("answerContainer");
  container.innerHTML = "";

  const parts = question.split(",");

  parts.forEach(p => {

    if (p.trim() === "__") {

      let input = document.createElement("input");
      input.type = "number";
      input.className = "seriesInput";
      input.style.width = "60px";

      container.appendChild(input);

    } else {

      let span = document.createElement("span");
      span.innerText = p.trim() + " ";
      container.appendChild(span);
    }

  });

}


// ✅ CHECK ANSWER
function checkAnswer(){

  let correctAnswer = questions[index].a;

  // ✅ MULTI
  if(Array.isArray(correctAnswer)){

    let inputs = document.querySelectorAll(".seriesInput");

    let userAnswers = Array.from(inputs).map(i => i.value);

    if(userAnswers.some(v => v === "")) return;

    let isCorrect = correctAnswer.every((val,i) => Number(val) === Number(userAnswers[i]));

    if(isCorrect){
      document.getElementById("feedback").innerText="✅ Correct";
    } else {
      document.getElementById("feedback").innerText=
        "❌ Answer: " + correctAnswer.join(", ");
    }

  }

  // ✅ SINGLE
  else {

    let user = document.getElementById("answer").value;

    if(user === "") return;

    if(Number(user) === Number(correctAnswer)){
      document.getElementById("feedback").innerText="✅ Correct";
    } else {
      document.getElementById("feedback").innerText=
        "❌ Answer: " + correctAnswer;
    }
  }

  index++;
  setTimeout(showQ,1000);
}

// ✅ START
showQ();

</script>

</body>
</html>
