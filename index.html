<!DOCTYPE html>
<html>
<head>
<title>Math Learning App</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">


<style>
body {
  font-family: Arial;
  text-align:center;
  padding:20px;
  background: linear-gradient(135deg, #74ebd5, #9face6);
}


<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2c3e50">


/* ✅ APP CARD */
.container {
  background:white;
  padding:20px;
  border-radius:20px;
  max-width:420px;
  margin:auto;
  box-shadow:0 0 20px rgba(0,0,0,0.2);
}

/* ✅ BUTTON ANIMATION */


<button id="installBtn" style="display:none;" onclick="installApp()">📲 Install App</button>


button {
  padding:12px;
  margin:8px;
  width:220px;
  font-size:16px;
  border-radius:10px;
  transition: transform 0.2s, background 0.2s;
}

button:active {
  transform: scale(0.95);
  background:#4CAF50;
}

input {
  padding:10px;
  font-size:16px;
  width:150px;
  text-align:center;
}

#progressBar {
  height:20px;
  width:0%;
  background:green;
  border-radius:10px;
  transition: width 0.4s;
}

/* ✅ CONFETTI */
@keyframes fall {
  to { transform: translateY(100vh); }
}
</style>
</head>

<body>

<div class="container">

<h2>
<img src="icon.png" width="30" style="vertical-align:middle;">
Math Learning App
</h2>

<select id="studentSelect">
<option value="">Select Student</option>
</select><br><br>

<input type="text" id="newStudent" placeholder="Add New Name"><br><br>
<button onclick="startApp(); enableFullscreen();">Start</button>

<div id="menu" style="display:none;">
<button onclick="startQuiz('easy')">Easy</button>
<button onclick="startQuiz('medium')">Medium</button>
<button onclick="startQuiz('hard')">Hard</button>
</div>

<div id="typeMenu" style="display:none;">
<h3>Select Type</h3>
<button onclick="beginQuiz('add')">Addition</button>
<button onclick="beginQuiz('sub')">Subtraction</button>
<button onclick="beginQuiz('mul')">Multiplication</button>
<button onclick="beginQuiz('series')">Number Series</button>
</div>

<div id="quiz" style="display:none;">
<div style="width:100%; background:#ddd;">
<div id="progressBar"></div>
</div><br>

<h3 id="question"></h3>

<input id="answer" oninput="enableBtn()" onkeypress="if(event.key==='Enter') checkAnswer()"><br><br>

<button id="submitBtn" onclick="checkAnswer()" disabled>Submit</button>
<p id="feedback"></p>
</div>

<div id="resultBox" style="display:none;">
<h3 id="result"></h3>
<h2 id="stars"></h2>
</div>

<div id="dashboard" style="display:none;">
<h2>📊 Student Dashboard</h2>
<h3 id="bestScore"></h3>

<table border="1" style="margin:auto;">
<thead>
<tr><th>Date</th><th>Score</th></tr>
</thead>
<tbody id="historyTable"></tbody>
</table>
</div>

<div id="leaderboard" style="display:none;">
  <h2>🏆 Leaderboard</h2>
  <ol id="leaderList"></ol>
</div>

<canvas id="scoreChart" width="350" height="200" style="display:none;"></canvas>


</div>

<script>

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js")
    .then(() => console.log("✅ Service Worker registered"));
}



let deferredPrompt;

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;

  // Show your own install button
  document.getElementById("installBtn").style.display = "block";
});



let currentUser="", questions=[], index=0, score=0;
let selectedLevel="";

let correct=[
"Fantastic!","Superstar!","Brilliant!","Champion!","On fire!"
];

// ✅ SOUND
let correctSound = new Audio("https://www.soundjay.com/buttons/sounds/button-09.mp3");
let wrongSound = new Audio("https://www.soundjay.com/buttons/sounds/button-10.mp3");

function rand(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }



// ✅ FULLSCREEN
function enableFullscreen() {
  let elem = document.documentElement;

  if (elem.requestFullscreen) {
    elem.requestFullscreen();
  } else if (elem.webkitRequestFullscreen) {
    elem.webkitRequestFullscreen();
  } else if (elem.msRequestFullscreen) {
    elem.msRequestFullscreen();
  }
}



// ✅ INSTALLAPP
function installApp() {
  if (deferredPrompt) {
    deferredPrompt.prompt();

    deferredPrompt.userChoice.then(() => {
      deferredPrompt = null;
    });
  }
}




// ✅ CONFETTI
function showConfetti(){
 for(let i=0;i<25;i++){
  let d=document.createElement("div");
  d.style.position="fixed";
  d.style.width="6px";
  d.style.height="6px";
  d.style.background="red";
  d.style.top="0px";
  d.style.left=Math.random()*window.innerWidth+"px";
  d.style.animation="fall 1.5s linear";
  document.body.appendChild(d);
  setTimeout(()=>d.remove(),1500);
 }
}

// ✅ STUDENTS
function loadStudents(){
 let list=JSON.parse(localStorage.getItem("students")||"[]");
 let sel=document.getElementById("studentSelect");
 list.forEach(n=>{
  let o=document.createElement("option");
  o.value=n; o.text=n; sel.add(o);
 });
}
window.onload=loadStudents;

// ✅ START
function startApp(){
 let s=document.getElementById("studentSelect").value;
 let n=document.getElementById("newStudent").value.trim();

 if(n){
  currentUser=n;
  let list=JSON.parse(localStorage.getItem("students")||"[]");
  if(!list.includes(n)){
   list.push(n);
   localStorage.setItem("students",JSON.stringify(list));
  }
 }
 else if(s){ currentUser=s; }
 else return alert("Enter/select name");

 document.getElementById("menu").style.display="block";
}

function startQuiz(level){
 selectedLevel=level;
 document.getElementById("menu").style.display="none";
 document.getElementById("typeMenu").style.display="block";
}

// ✅ HYBRID QUIZ
async function beginQuiz(type){

  let sheetQuestions = await fetchQuestions(selectedLevel, type);
  let finalQuestions = [];

  // ✅ TAKE ALL SHEET QUESTIONS AS-IS (NO FILTERING)
  if(sheetQuestions.length > 0){
    sheetQuestions.sort(()=>0.5 - Math.random());

    // ✅ Take up to 10 (no restriction applied)
    finalQuestions = sheetQuestions.slice(0,10);
  }

  // ✅ FILL WITH RANDOM ONLY IF NEEDED
  while(finalQuestions.length < 10){

    let q = generateRandomQuestion(selectedLevel, type);

    // ✅ Avoid duplicates ONLY against existing questions
    if(!finalQuestions.some(x => x.q === q.q)){
      finalQuestions.push(q);
    }
  }

  questions = finalQuestions;

  index = 0;
  score = 0;

  document.getElementById("typeMenu").style.display = "none";
  document.getElementById("quiz").style.display = "block";

  showQ();
}


// ✅ FETCH SHEET
async function fetchQuestions(level,type){
 const url="https://script.google.com/macros/s/AKfycbwkGmHle5nKcXW76qLKy7yNLuc-_rYYzlbGH0yDh44KAwH7ok7dyTVktibtibDoTHor/exec";
 let res=await fetch(url);
 let data=await res.json();

 return data.filter(q=>q.level===level && q.type===type)
  .map(q=>({q:q.question,a:q.answer}));
}

function generateRandomQuestion(level,type){
 if(type==="add") return addQ(level);
 if(type==="sub") return subQ(level);
 if(type==="mul") return mulQ(level);
 return seriesQ();
}

// ✅ QUESTIONS
function addQ(level){
 let count=rand(2,6), max=level==="easy"?9:level==="medium"?49:100;
 let nums=[],sum=0;
 for(let i=0;i<count;i++){let n=rand(0,max); nums.push(n); sum+=n;}
 return {q:nums.join(" + ")+" = ?",a:sum};
}

function subQ(level){
 let max=level==="easy"?9:level==="medium"?49:100;
 let a=rand(0,max), b=rand(0,a);
 return {q:a+" - "+b+" = ?",a:a-b};
}

function mulQ(level){
 let count=rand(2,3), max=level==="easy"?9:level==="medium"?12:20;
 let nums=[];
 for(let i=0;i<count;i++) nums.push(rand(1,max));
 return {q:nums.join(" × "),a:nums.reduce((x,y)=>x*y)};
}

function seriesQ(){
 let steps=[1,2,3,-1,-2,-3];
 let step=steps[rand(0,5)];
 let start=rand(5,50);

 let arr=[];
 for(let i=0;i<5;i++){
  let v=start+i*step;
  if(v<1) return seriesQ();
  arr.push(v);
 }

 let m=rand(1,3);
 let ans=arr[m];
 arr[m]="__";

 return {q:arr.join(", "),a:ans};
}

// ✅ QUIZ
function showQ(){
 if(index>=questions.length) return finish();

 document.getElementById("answer").value="";
 document.getElementById("submitBtn").disabled=true;
 document.getElementById("feedback").innerText="";

 document.getElementById("question").innerText=questions[index].q;

 setTimeout(()=>document.getElementById("answer").focus(),100);
}

function enableBtn(){
 let v=document.getElementById("answer").value.trim();
 document.getElementById("submitBtn").disabled=(v===""||isNaN(v));
}

function checkAnswer(){
 let user=document.getElementById("answer").value.trim();
 if(user===""||isNaN(user)) return;

 let correctAnswer=questions[index].a;

 if(user==correctAnswer){
  correctSound.play();
  showConfetti();
  document.getElementById("feedback").innerText=correct[rand(0,4)];
  score++;
 } else {
  wrongSound.play();
  document.getElementById("feedback").innerText="Answer: "+correctAnswer;
 }

 index++;
 updateBar();
 setTimeout(showQ,1000);
}

function updateBar(){
 let p=(index/questions.length)*100;
 document.getElementById("progressBar").style.width=p+"%";
}

// ✅ RESULT
function stars(s){
 if(s===10) return "⭐⭐⭐⭐⭐";
 if(s>=8) return "⭐⭐⭐⭐";
 if(s>=6) return "⭐⭐⭐";
 return "⭐⭐";
}

function finish(){
 document.getElementById("quiz").style.display="none";
 document.getElementById("resultBox").style.display="block";

 document.getElementById("result").innerText=currentUser+" scored "+score+"/10";
 document.getElementById("stars").innerText=stars(score);

 saveScoreToSheet(currentUser,score);

 setTimeout(()=>loadDashboard(currentUser),1500);
}

// ✅ SAVE
function saveScoreToSheet(name,score){
 const url="https://script.google.com/macros/s/AKfycbwkGmHle5nKcXW76qLKy7yNLuc-_rYYzlbGH0yDh44KAwH7ok7dyTVktibtibDoTHor/exec";

 fetch(url,{
  method:"POST",
  mode:"no-cors",
  body:JSON.stringify({name,score}),
  headers:{"Content-Type":"application/json"}
 });
}

// ✅ DASHBOARD


function loadDashboard(name){
 const url="https://script.google.com/macros/s/AKfycbwkGmHle5nKcXW76qLKy7yNLuc-_rYYzlbGH0yDh44KAwH7ok7dyTVktibtibDoTHor/exec";

 fetch(url)
 .then(res=>res.json())
 .then(data=>{

   let userData = data.filter(d=>d.name===name);

   if(!userData.length) return;

   // ✅ BEST SCORE
   let best = Math.max(...userData.map(x=>x.score));
   document.getElementById("bestScore").innerText =
   "🏆 Best Score: " + best + "/10";

   // ✅ HISTORY TABLE
   let table=document.getElementById("historyTable");
   table.innerHTML="";

   userData.slice().reverse().forEach(d=>{
     let tr=document.createElement("tr");
     let date=new Date(d.date).toLocaleDateString();

     tr.innerHTML="<td>"+date+"</td><td>"+d.score+"/10</td>";
     table.appendChild(tr);
   });

   document.getElementById("dashboard").style.display="block";

   // ✅ ✅ LEADERBOARD
   let bestScores = {};

   data.forEach(d=>{
     if(!bestScores[d.name] || d.score > bestScores[d.name]){
       bestScores[d.name] = d.score;
     }
   });

   let sorted = Object.entries(bestScores)
     .sort((a,b)=>b[1]-a[1])
     .slice(0,5);

   let list = document.getElementById("leaderList");
   list.innerHTML="";

   sorted.forEach(([n,s])=>{
     let li=document.createElement("li");
     li.textContent = n + " - " + s + "/10";
     list.appendChild(li);
   });

   document.getElementById("leaderboard").style.display="block";

   // ✅ ✅ GRAPH (Chart)
   let labels = userData.map(d => new Date(d.date).toLocaleDateString());
   let scores = userData.map(d => d.score);

   let ctx = document.getElementById("scoreChart").getContext("2d");

   document.getElementById("scoreChart").style.display="block";

   new Chart(ctx, {
     type: 'line',
     data: {
       labels: labels,
       datasets: [{
         label: 'Score Progress',
         data: scores,
         borderColor: 'blue',
         fill: false
       }]
     },
     options: {
       scales: {
         y: {
           beginAtZero: true,
           max: 10
         }
       }
     }
   });

 });
}



</script>

</body>
</html>
